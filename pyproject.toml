[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protrusion-memory"
version = "1.2.0"
description = "Mechanochemical protrusion models and reporter discrimination"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "LicenseRef-Protrusion-Memory-Reproduction"
license-files = ["LICENSE"]
dependencies = ["numpy==2.3.5", "scipy==1.16.3"]

[project.urls]
Repository = "https://github.com/renatosocodato/protrusion-memory-reproducibility"

[project.scripts]
protrusion-memory = "protrusion_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
